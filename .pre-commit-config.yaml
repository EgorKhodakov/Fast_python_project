# Список репозиториев с проверками
repos:
  # Первый репозиторий — сортировка импортов
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2                      # версия isort
    hooks:
      - id: isort  # сортируем импорты по алфавиту
        args: ["--profile", "black"]


  # Второй репозиторий — автоформатирование black
  - repo: https://github.com/psf/black
    rev: 24.4.0                      # версия black
    hooks:
      - id: black                     # запускаем black на всех Python-файлах


  # Третий репозиторий — общие проверки от pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0                      # версия набора хуков
    hooks:
      - id: trailing-whitespace       # убирает пробелы в конце строк
      - id: end-of-file-fixer         # добавляет пустую строку в конце файла
      - id: check-yaml                # проверяет синтаксис yaml-файлов
      - id: check-added-large-files   # запрещает коммитить файлы > 500 КБ
